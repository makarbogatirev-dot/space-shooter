# Деплой сервера аккаунтов на Render (Blueprint).
# База — PostgreSQL (free): данные переживают перезапуски и переразвёртывания,
# в отличие от SQLite на диске бесплатного веб-сервиса, который обнуляется
# при каждом деплое и после простоя.
services:
  - type: web
    name: space-shooter-accounts
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server/app.py"
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: accounts-db
          property: connectionString
      # Ограничить доступ только своим сайтом (по умолчанию разрешены любые
      # источники):
      # - key: ALLOWED_ORIGIN
      #   value: https://makarbogatirev-dot.github.io

databases:
  - name: accounts-db
    databaseName: accounts
    plan: free
    region: frankfurt
    # Внимание: бесплатный PostgreSQL на Render живёт 30 дней, потом требует
    # продления одной кнопкой в дашборде (Render -> Postgres -> Keep instance).
